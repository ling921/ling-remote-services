name: Publish NuGet Packages

on:
  workflow_dispatch:
  release:
    types:
      - published

env:
  NuGetDirectory: ${{ github.workspace }}/nuget

jobs:
  publish:
    environment: production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Test and pack public packages
        shell: bash
        run: bash scripts/pack.sh --configuration Release --runtime linux-x64 --output "${{ env.NuGetDirectory }}"

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ling921

      - name: Publish to NuGet
        run: |
          for file in "${{ env.NuGetDirectory }}"/*.nupkg; do
            if [ -f "$file" ]; then
              dotnet nuget push "$file" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
