name: Run Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-env

      - name: Build, test, and verify Native AOT
        shell: bash
        run: bash scripts/test.sh --configuration Release --runtime linux-x64
